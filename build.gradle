plugins {
    id 'application'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'com.realtectonics'
version = '0.1.0'
base { archivesName = 'realtectonics' }

repositories {
    maven { url = 'https://api.modrinth.com/maven' } // the dev client's mods
}

loom {
    runs {
        client { vmArgs '-Xmx8G'; runDir 'run-fabric' } // not run/: its 1.21.1 worlds would be upgraded for good, and its mods are NeoForge's
        server { runDir 'run-server' } // its own folder: client-only mods would crash a server
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Dev client only, by Modrinth version id: Voxy draws far-off terrain as LODs (it needs Sodium); Biomes O' Plenty
    // lets new worlds pick its realistic biomes (TectonicBiomeSource "biomesoplenty" pack).
    localRuntime 'maven.modrinth:sodium:xJZxADzI'         // mc26.2-0.9.2-fabric
    localRuntime 'maven.modrinth:voxy:LzyXnE51'           // 0.2.19-beta
    localRuntime 'maven.modrinth:biomes-o-plenty:MNZPk6V0' // 26.2.0.0.28
    localRuntime 'maven.modrinth:terrablender:KQix25Qc'
    localRuntime 'maven.modrinth:glitchcore:SDUCBYRU'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

// Minecraft 26.x runs on Java 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

// The standalone simulation preview: gradlew run --args="..."
application { mainClass = 'com.realtectonics.sim.Prototype' }
tasks.named('run') { jvmArgs '-Xmx4g' }

test { useJUnitPlatform() }

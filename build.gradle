plugins {
    id 'application'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'com.realtectonics'
version = '0.1.3'
base { archivesName = 'realtectonics-fabric-26.2' } // jar: realtectonics-fabric-26.2-<version>.jar

// Client-only mods for the dev client: loaded through fabric.addMods so the dev server runs without them, as a real one would.
configurations { clientMods { transitive = false } }

repositories {
    maven { url = 'https://api.modrinth.com/maven' } // the dev client's mods
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Dev client only, by Modrinth version id (clientMods below): Voxy draws far-off terrain as LODs (it needs Sodium).
    // Voxy only draws generated chunks; Voxy WorldGen generates them around you in the background and hands them to it,
    // so far ranges show up without exploring. Cloth Config is its settings library, Mod Menu the button to open them.
    clientMods 'maven.modrinth:sodium:xJZxADzI'         // mc26.2-0.9.2-fabric
    clientMods 'maven.modrinth:voxy:LzyXnE51'           // 0.2.19-beta
    clientMods 'maven.modrinth:voxy-worldgen:fZooaCeC'  // 2.4.3
    clientMods 'maven.modrinth:cloth-config:Nv3xnWXd'   // 26.2.155+fabric
    clientMods 'maven.modrinth:modmenu:iRo7AZXf'        // 20.0.3
    clientMods 'maven.modrinth:orthocamera:nURmQGL6'    // 0.1.11+26.2: orthographic view (needs Sodium's block face culling off)
    // Atmosphere: biome and weather sounds, a livelier first-person view, falling leaves and waterfall spray.
    clientMods 'maven.modrinth:ambientsounds:jGlT0HRa'  // 6.3.6
    clientMods 'maven.modrinth:creativecore:SI6rsPDj'   // 2.14.16, AmbientSounds' library
    clientMods 'maven.modrinth:punchy-fpa:m5Z8xxnH'     // 3.2
    clientMods 'maven.modrinth:particular-reforged:1VSvTbTm' // 1.5.7
    clientMods 'maven.modrinth:baguettelib:fFGGMnVe'    // 2.0.7, Particular's library
    clientMods 'maven.modrinth:forge-config-api-port:rSd3GiG8' // 26.2.1, Particular's config
    // Both sides: Biomes O' Plenty lets new worlds pick its realistic biomes (TectonicBiomeSource "biomesoplenty" pack).
    // localRuntime 'maven.modrinth:streams-reflowing:t9NK6sX3' // 2.15.2: extra streams carved over our terrain; vanillaWaterFlow=false in its config. Off: ~a fifth of generation time
    localRuntime 'maven.modrinth:biomes-o-plenty:MNZPk6V0' // 26.2.0.0.28
    localRuntime 'maven.modrinth:terrablender:KQix25Qc'
    localRuntime 'maven.modrinth:glitchcore:SDUCBYRU'
    localRuntime 'maven.modrinth:wwoo:dV5vFVEf' // 2.7.1: William Wythers' vanilla biome overhaul; its trees and plants show, its terrain noise and sub-biomes don't (our generator and biome table)
    localRuntime 'maven.modrinth:cristel-lib:6cKPC8Up' // 3.1.13, WWOO's library

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// After dependencies: the client run lists clientMods' files.
loom {
    runs {
        client {
            // ZGC: G1's pauses (up to ~36 ms while chunks generate nonstop) were the microstutters; ZGC's stay under 1 ms (tools/stutter.jsh).
            // With Voxy WorldGen churning chunks (~1 GB/s of garbage) ZGC's default threads fell behind and stalled every thread,
            // the render thread for 17-65 ms (323 stalls a minute in JFR): 3 GC threads keep it ahead.
            vmArgs '-Xmx8G', '-XX:+UseZGC', '-XX:ConcGCThreads=3', "-Dfabric.addMods=${configurations.clientMods.files.join(File.pathSeparator)}"
            runDir 'run-fabric' // not run/: its 1.21.1 worlds would be upgraded for good, and its mods are NeoForge's
        }
        server { runDir 'run-server'; vmArgs '-XX:+UseZGC' } // its own folder: client-only mods would crash a server
    }
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

// Minecraft 26.x runs on Java 25
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

// The standalone simulation preview: gradlew run --args="..."
application { mainClass = 'com.realtectonics.sim.Prototype' }
tasks.named('run') { jvmArgs '-Xmx4g' }

test { useJUnitPlatform() }
